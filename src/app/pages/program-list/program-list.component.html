<section class="wrap page-head">
  <p class="kicker">Catalog</p>
  <h1>{{ heading() }}</h1>
  <p class="lead">{{ intro() }}</p>
</section>
<section class="section wrap">
  <div class="grid cards-2">
    @for (program of programs(); track program.slug) {
      <a class="card" [routerLink]="[base(), program.slug]">
        <p class="meta">
          @if (program.days) { {{ program.days }} days · }
          {{ program.level }}
        </p>
        <h3>{{ program.title }}</h3>
        <p>{{ program.summary }}</p>
        <p class="price">From {{ program.feeFrom | number:'1.0-0' }} USD</p>
      </a>
    }
  </div>
</section>
